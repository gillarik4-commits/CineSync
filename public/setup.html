<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CineSync - Host Setup</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="setup-page-body">
  <div class="setup-card">
    <div class="setup-header">
      <h1 class="setup-brand">CineSync</h1>
      <p class="setup-sub">Host a real-time synchronized watch party</p>
    </div>

    <!-- Stepper (1 Choose file -> 2 Pick tracks -> 3 Prepare) -->
    <div class="stepper">
      <div class="step-item active" id="stepIndicator1">
        <span class="step-badge">1</span>
        <span>Choose file</span>
      </div>
      <div class="step-item" id="stepIndicator2">
        <span class="step-badge">2</span>
        <span>Pick tracks</span>
      </div>
      <div class="step-item" id="stepIndicator3">
        <span class="step-badge">3</span>
        <span>Prepare</span>
      </div>
    </div>

    <!-- Step 1: File Selection -->
    <div id="setup-step-1">
      <div class="form-group">
        <label for="filepath-input">Movie File</label>
        <div class="path-input-row">
          <input type="text" id="filepath-input" class="mono-input" placeholder="/home/user/Movies/movie.mkv" autocomplete="off" spellcheck="false">
          <button type="button" class="browse-btn" id="browseMovieBtn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"/></svg>
            Browse
          </button>
        </div>
        <div class="field-hint">Browse your computer for the movie, or paste its full path.</div>
      </div>

      <!-- Recent Files list from localStorage -->
      <div class="recent-files-container" id="recentFilesContainer" style="display: none;">
        <div class="recent-files-title">Recent Files</div>
        <div id="recentFilesList"></div>
      </div>

      <div class="error-banner" id="inspectError"></div>

      <button id="inspect-btn" class="primary-btn" style="margin-top: 16px;">Inspect Media</button>
    </div>

    <!-- Step 2: Track Selection -->
    <div id="setup-step-2" style="display: none;">
      <div style="font-size: 12px; color: var(--text-dim); margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between;">
        <span>Video Codec: <strong id="videoCodecBadge" style="color: var(--text); font-family: var(--font-mono);"></strong></span>
        <button id="btnChangeFile" style="background: none; border: none; color: var(--accent); font-size: 12px; cursor: pointer; text-decoration: underline;">Change file</button>
      </div>

      <div class="form-group">
        <label for="audio-select">Audio Track</label>
        <div class="custom-select-wrapper">
          <select id="audio-select" class="custom-select"></select>
        </div>
      </div>

      <div class="form-group">
        <label for="sub-select">Embedded Subtitle Track</label>
        <div class="custom-select-wrapper">
          <select id="sub-select" class="custom-select"></select>
        </div>
      </div>

      <div class="form-group">
        <label for="external-sub-input">External Subtitle File (Optional .srt / .vtt)</label>
        <div class="path-input-row">
          <input type="text" id="external-sub-input" class="mono-input" placeholder="/home/user/Movies/subtitles.srt" autocomplete="off" spellcheck="false">
          <button type="button" class="browse-btn" id="browseSubBtn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"/></svg>
            Browse
          </button>
        </div>
        <div class="field-hint" id="externalSubHint">Providing an external subtitle file will override embedded tracks.</div>
      </div>

      <div class="error-banner" id="prepareError"></div>

      <button id="start-btn" class="primary-btn" style="margin-top: 8px;">Start Watch Party</button>

      <!-- Step 3: Progress Container -->
      <div id="progress-container">
        <p id="progress-text">Preparing...</p>
        <div class="progress-bar-bg indeterminate" id="progressBarBg">
          <div class="progress-bar-fill" id="progress-bar"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- File Browser Modal -->
  <div class="fb-overlay" id="fileBrowser" hidden>
    <div class="fb-dialog" role="dialog" aria-modal="true" aria-labelledby="fbTitle">
      <div class="fb-header">
        <h2 class="fb-title" id="fbTitle">Choose a movie</h2>
        <button type="button" class="fb-close" id="fbCloseBtn" title="Close (Esc)" aria-label="Close">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>

      <div class="fb-places" id="fbPlaces"></div>

      <div class="fb-pathbar">
        <button type="button" class="fb-up" id="fbUpBtn" title="Up one folder (Backspace)" aria-label="Up one folder">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"/></svg>
        </button>
        <div class="fb-path" id="fbPath" title=""></div>
      </div>

      <input type="text" class="fb-filter" id="fbFilter" placeholder="Filter this folder…" autocomplete="off" spellcheck="false" aria-label="Filter this folder">

      <div class="fb-list" id="fbList" role="listbox" aria-label="Folder contents"></div>

      <div class="fb-footer" id="fbFooter"></div>
    </div>
  </div>

  <script src="/setup.js"></script>
</body>
</html>
