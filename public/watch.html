<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CineSync</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Join Modal Gate -->
  <div id="joinModal" class="modal-overlay">
    <div class="modal-content">
      <h3>CineSync</h3>
      <p class="modal-desc">Pick a name to join the room</p>
      <form id="joinForm">
        <input type="text" id="usernameInput" placeholder="Display name" required autofocus autocomplete="nickname">
        <button type="submit">Join Watch Party</button>
      </form>
    </div>
  </div>

  <!-- Media Changing Fullscreen HUD -->
  <div id="mediaChangingOverlay" class="modal-overlay" style="display: none;">
    <div class="media-changing-content">
      <div class="media-changing-spinner"></div>
      <p class="media-changing-text">Host is switching the movie...</p>
    </div>
  </div>

  <!-- Main Theatre Container -->
  <div class="app-container" id="app-container">
    <div class="video-section">
      <!-- Floating Top Header -->
      <header id="player-header">
        <div class="header-left">
          <h2 class="brand-title">CineSync</h2>
        </div>
        <div class="header-right">
          <div class="online-pill" id="onlinePillBtn" title="View active participants" tabindex="0" role="button">
            <span class="live-dot"></span>
            <span id="userCountBadge">1 online</span>
          </div>
          <button class="share-btn" id="shareBtn" title="Copy public watch party link">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
            <span id="shareBtnText">Share Link</span>
          </button>
        </div>
      </header>

      <!-- Participants Popover -->
      <div class="participants-popover" id="participantsPopover">
        <div class="participants-title">Participants in Room</div>
        <div class="participants-list" id="participantsList">
          <div class="participant-item">
            <span class="user-avatar">•</span>
            <span>You</span>
          </div>
        </div>
      </div>

      <!-- Player Canvas Wrapper -->
      <div id="player-wrapper">
        <video id="player" preload="metadata" playsinline crossorigin="anonymous">
          <track id="sub-track" kind="subtitles" src="/media/subtitles.vtt" default>
        </video>

        <!-- Centered Buffering Spinner -->
        <div class="buffering-indicator" id="bufferingIndicator"></div>

        <!-- Autoplay Block Prompt Overlay -->
        <div class="autoplay-overlay" id="autoplayOverlay">
          <button class="autoplay-btn" id="autoplayBtn">Click to join the stream</button>
        </div>

        <!-- Custom Controls Bar -->
        <div class="controls-bar" id="controls-bar">
          <div class="scrubber-container" id="scrubber">
            <div class="scrubber-fill" id="scrubber-fill"></div>
            <div class="scrubber-hover-time" id="scrubber-hover">00:00</div>
          </div>

          <div class="controls-row">
            <div class="controls-left">
              <button class="control-btn" id="btn-playpause" title="Play / Pause (Space)">
                <svg id="icon-play" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="6 3 20 12 6 21 6 3"/></svg>
                <svg id="icon-pause" style="display:none;" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="10" y1="4" x2="10" y2="20"/><line x1="14" y1="4" x2="14" y2="20"/></svg>
              </button>
              <button class="control-btn" id="btn-skipback" title="Rewind 10s (Left Arrow)">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 10h14a6 6 0 0 1 6 6v0a6 6 0 0 1-6 6H7"/><polyline points="5 6 1 10 5 14"/></svg>
              </button>
              <button class="control-btn" id="btn-skipfwd" title="Skip 10s (Right Arrow)">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 10H9a6 6 0 0 0-6 6v0a6 6 0 0 0 6 6h8"/><polyline points="19 6 23 10 19 14"/></svg>
              </button>
              <div class="volume-container">
                <button class="control-btn" id="btn-mute" title="Mute / Unmute (M)">
                  <svg id="icon-vol-high" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
                  <svg id="icon-vol-muted" style="display:none;" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="22" y1="9" x2="16" y2="15"/><line x1="16" y1="9" x2="22" y2="15"/></svg>
                </button>
                <input type="range" class="volume-slider" id="volume-slider" min="0" max="1" step="0.05" value="1" title="Volume">
              </div>
              <span class="time-display" id="time-display">00:00 / 00:00</span>
            </div>

            <div class="controls-right">
              <button class="control-btn" id="btn-change-media" title="Change Movie (Host)">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m4 6 2 2h14a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/></svg>
              </button>
              <button class="control-btn" id="btn-cc" title="Toggle Subtitles (C)">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="M7 15h3a2 2 0 0 0 2-2v-2a2 2 0 0 0-2-2H7v6z"/><path d="M15 15h3a2 2 0 0 0 2-2v-2a2 2 0 0 0-2-2h-3v6z"/></svg>
              </button>
              <div class="chat-btn-wrapper" id="chatBtnWrapper">
                <button class="control-btn" id="btn-chat" title="Chat (T)">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                  <span class="chat-unread-dot" id="chatUnreadDot" style="display: none;"></span>
                </button>
                <div class="chat-mode-menu" id="chatModeMenu">
                  <div class="chat-mode-menu-title">Fullscreen Chat</div>
                  <button class="chat-mode-option" data-mode="ambient" type="button">
                    <span class="mode-indicator"></span>
                    <div class="mode-info">
                      <span class="mode-label">Ambient</span>
                      <span class="mode-desc">Subtle fading pills</span>
                    </div>
                  </button>
                  <button class="chat-mode-option" data-mode="panel" type="button">
                    <span class="mode-indicator"></span>
                    <div class="mode-info">
                      <span class="mode-label">Panel</span>
                      <span class="mode-desc">Floating 280px HUD</span>
                    </div>
                  </button>
                  <button class="chat-mode-option" data-mode="off" type="button">
                    <span class="mode-indicator"></span>
                    <div class="mode-info">
                      <span class="mode-label">Off</span>
                      <span class="mode-desc">Muted, unread dot</span>
                    </div>
                  </button>
                </div>
              </div>
              <button class="control-btn" id="btn-fullscreen" title="Fullscreen (F)">
                <svg id="icon-fs-enter" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
                <svg id="icon-fs-exit" style="display:none;" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3v3a2 2 0 0 1-2 2H3"/><path d="M21 8h-3a2 2 0 0 1-2-2V3"/><path d="M3 16h3a2 2 0 0 1 2 2v3"/><path d="M16 21v-3a2 2 0 0 1 2-2h3"/></svg>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Right Sidebar / Fullscreen HUD Chat Panel -->
    <div class="chat-panel" id="chat-panel">
      <!-- Fullscreen Drag Handle -->
      <div class="hud-drag-handle" id="hudDragHandle" title="Drag chat window">
        <span class="hud-drag-pill"></span>
      </div>

      <div class="chat-header">
        <span>Chat</span>
        <div class="chat-header-actions">
          <button class="control-btn" id="btn-minimize-chat" title="Minimize / Expand HUD" style="width: 24px; height: 24px;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/></svg>
          </button>
          <button class="control-btn" id="btn-close-chat" title="Close chat" style="width: 24px; height: 24px;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
      </div>

      <div class="chat-messages" id="chatFeed" role="log" aria-live="polite">
        <!-- New messages floating notification -->
        <div class="new-messages-pill" id="newMessagesPill">
          <span class="live-dot"></span>
          <span>New messages</span>
        </div>
      </div>

      <!-- Ambient Discoverability Hint -->
      <div class="ambient-reply-hint" id="ambientReplyHint">
        <span class="ambient-hint-key" id="ambientHintKey">Enter</span>
        <span class="ambient-hint-text">to reply</span>
      </div>

      <div class="chat-input-area">
        <div class="reactions-bar">
          <button class="reaction-btn" title="React Fire">🔥</button>
          <button class="reaction-btn" title="React Laugh">😂</button>
          <button class="reaction-btn" title="React Popcorn">🍿</button>
          <button class="reaction-btn" title="React Heart">❤️</button>
        </div>
        <div class="chat-input-row">
          <input type="text" id="chatInput" placeholder="Send a message..." autocomplete="off" aria-label="Reply to the room" maxlength="200">
          <span class="ambient-char-counter" id="ambientCharCounter"></span>
          <span class="ambient-return-glyph" id="ambientReturnGlyph" title="Press Enter to send">↵</span>
          <button id="sendBtn">Send</button>
        </div>
      </div>

      <!-- Corner Resize Handle for Fullscreen HUD -->
      <div class="hud-corner-handle" id="hudCornerHandle" title="Resize chat window"></div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
